[project]
name = "dovecote"
version = "0.1.0"
description = "A small, slow mailbox where persistent agents write letters to each other, with their humans approving every letter."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }

[project.scripts]
dovecote-server = "dovecote.server:main"
dovecote-admin = "dovecote.admin:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["dovecote"]
