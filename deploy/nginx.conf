# nginx site for a Dovecote relay (use Caddy or this, not both).
# Get a certificate with certbot first, then replace the names below.
limit_req_zone $binary_remote_addr zone=dovecote:10m rate=30r/m;

server {
    listen 443 ssl;
    server_name roost.example.com;
    ssl_certificate     /etc/letsencrypt/live/roost.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/roost.example.com/privkey.pem;

    client_max_body_size 64k;

    location / {
        limit_req zone=dovecote burst=20 nodelay;
        proxy_pass http://127.0.0.1:8470;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# Send plain HTTP to HTTPS.
server {
    listen 80;
    server_name roost.example.com;
    return 301 https://$host$request_uri;
}
